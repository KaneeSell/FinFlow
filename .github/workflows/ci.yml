name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-e2e:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next SemVer version
        id: version
        shell: bash
        run: |
          LATEST_TAG=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)
          if [ -z "$LATEST_TAG" ]; then
            NEXT_VERSION=$(node -p "require('./package.json').version")
          else
            BASE="${LATEST_TAG#v}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE"
            COMMIT_MSG=$(git log -1 --pretty=%B)
            if echo "$COMMIT_MSG" | grep -qE '(^BREAKING CHANGE|^[a-z]+(\([^)]+\))?!:)'; then
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
            elif echo "$COMMIT_MSG" | grep -qE '^feat(\([^)]+\))?:'; then
              MINOR=$((MINOR + 1))
              PATCH=0
            else
              PATCH=$((PATCH + 1))
            fi
            NEXT_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          fi
          echo "version=${NEXT_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${NEXT_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Computed release version: v${NEXT_VERSION} (previous tag: ${LATEST_TAG:-none})"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Typecheck, Unit & API Tests, Build
        run: npm run verify

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run E2E Tests
        run: npm run test:e2e

  build-windows:
    needs: verify-and-e2e
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run db:generate
      - run: npm run build
        env:
          FINFLOW_APP_VERSION: ${{ needs.verify-and-e2e.outputs.version }}
      - run: npm run prepare:api --workspace=@finflow/desktop
      - run: npm run smoke:api --workspace=@finflow/desktop

      - name: Package Windows (.exe & .msi)
        run: npm run package:win --workspace=@finflow/desktop -- --config.extraMetadata.version=${{ needs.verify-and-e2e.outputs.version }}

      - name: Verify Windows installers exist
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path release/desktop -Filter *.exe
          $msi = Get-ChildItem -Path release/desktop -Filter *.msi
          if (-not $exe) { throw "Missing .exe installer in release/desktop" }
          if (-not $msi) { throw "Missing .msi installer in release/desktop" }
          $exe.Name; $msi.Name

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: |
            release/desktop/*.exe
            release/desktop/*.msi

  build-linux:
    needs: verify-and-e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run db:generate
      - run: npm run build
        env:
          FINFLOW_APP_VERSION: ${{ needs.verify-and-e2e.outputs.version }}
      - run: npm run prepare:api --workspace=@finflow/desktop
      - run: npm run smoke:api --workspace=@finflow/desktop

      - name: Package Linux (.AppImage & .deb)
        run: npm run package:linux --workspace=@finflow/desktop -- --config.extraMetadata.version=${{ needs.verify-and-e2e.outputs.version }}

      - name: Verify Linux installers exist
        run: |
          ls -la release/desktop/
          test -n "$(find release/desktop -maxdepth 1 -name '*.AppImage' -print -quit)"
          test -n "$(find release/desktop -maxdepth 1 -name '*.deb' -print -quit)"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-installers
          path: |
            release/desktop/*.AppImage
            release/desktop/*.deb

  build-android:
    needs: verify-and-e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Verify Android SDK & accept licenses
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - run: npm ci
      - run: npm run build:shared
      - run: npm run build:web
        env:
          FINFLOW_APP_VERSION: ${{ needs.verify-and-e2e.outputs.version }}

      - name: Sync & Build Android (.apk & .aab)
        working-directory: apps/mobile
        run: |
          npx cap add android || true
          npx cap sync android
          cd android
          ./gradlew assembleDebug bundleRelease

      - name: Verify Android outputs exist
        run: |
          test -n "$(find apps/mobile/android/app/build/outputs/apk/debug -name '*.apk' -print -quit)"
          test -n "$(find apps/mobile/android/app/build/outputs/bundle/release -name '*.aab' -print -quit)"

      - uses: actions/upload-artifact@v4
        with:
          name: android-builds
          path: |
            apps/mobile/android/app/build/outputs/apk/debug/*.apk
            apps/mobile/android/app/build/outputs/bundle/release/*.aab

  publish-release:
    needs: [verify-and-e2e, build-windows, build-linux, build-android]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish GitHub Release ${{ needs.verify-and-e2e.outputs.tag }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.verify-and-e2e.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: FinFlow ${{ needs.verify-and-e2e.outputs.tag }}
          generate_release_notes: true
          files: artifacts/**/*
