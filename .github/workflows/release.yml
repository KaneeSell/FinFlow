name: Release Multiplataforma

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run verify

  build-windows:
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run build
      - name: Package Windows (.exe & .msi)
        run: npm run package:win --workspace=@finflow/desktop
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: |
            release/desktop/*.exe
            release/desktop/*.msi

  build-linux:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run build
      - name: Package Linux (.AppImage & .deb)
        run: npm run package:linux --workspace=@finflow/desktop
      - uses: actions/upload-artifact@v4
        with:
          name: linux-installers
          path: |
            release/desktop/*.AppImage
            release/desktop/*.deb

  build-android:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - run: npm run build:web
      - name: Sync & Build Android (.apk & .aab)
        working-directory: apps/mobile
        run: |
          npx cap add android || true
          npx cap sync android
          cd android
          ./gradlew assembleDebug bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: android-builds
          path: |
            apps/mobile/android/app/build/outputs/apk/debug/*.apk
            apps/mobile/android/app/build/outputs/bundle/release/*.aab

  publish-release:
    needs: [build-windows, build-linux, build-android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/**/*
