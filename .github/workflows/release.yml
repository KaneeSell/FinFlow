name: Release Multiplataforma

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-and-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run verify
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  build-windows:
    needs: verify-and-e2e
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run build
      - run: npm run prepare:api --workspace=@finflow/desktop
      - run: npm run smoke:api --workspace=@finflow/desktop
      - name: Package Windows (.exe & .msi)
        run: npm run package:win --workspace=@finflow/desktop
      - name: Verify Windows installers exist
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path release/desktop -Filter *.exe
          $msi = Get-ChildItem -Path release/desktop -Filter *.msi
          if (-not $exe) { throw "Missing .exe installer in release/desktop" }
          if (-not $msi) { throw "Missing .msi installer in release/desktop" }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: |
            release/desktop/*.exe
            release/desktop/*.msi

  build-linux:
    needs: verify-and-e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run build
      - run: npm run prepare:api --workspace=@finflow/desktop
      - run: npm run smoke:api --workspace=@finflow/desktop
      - name: Package Linux (.AppImage & .deb)
        run: npm run package:linux --workspace=@finflow/desktop
      - name: Verify Linux installers exist
        run: |
          test -n "$(find release/desktop -maxdepth 1 -name '*.AppImage' -print -quit)"
          test -n "$(find release/desktop -maxdepth 1 -name '*.deb' -print -quit)"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-installers
          path: |
            release/desktop/*.AppImage
            release/desktop/*.deb

  build-android:
    needs: verify-and-e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Verify Android SDK & accept licenses
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - run: npm ci
      - run: npm run build:shared
      - run: npm run build:web
      - name: Sync & Build Android (.apk & .aab)
        working-directory: apps/mobile
        run: |
          npx cap add android || true
          npx cap sync android
          cd android
          ./gradlew assembleDebug bundleRelease
      - name: Verify Android outputs exist
        run: |
          test -n "$(find apps/mobile/android/app/build/outputs/apk/debug -name '*.apk' -print -quit)"
          test -n "$(find apps/mobile/android/app/build/outputs/bundle/release -name '*.aab' -print -quit)"
      - uses: actions/upload-artifact@v4
        with:
          name: android-builds
          path: |
            apps/mobile/android/app/build/outputs/apk/debug/*.apk
            apps/mobile/android/app/build/outputs/bundle/release/*.aab

  publish-release:
    needs: [build-windows, build-linux, build-android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/**/*
