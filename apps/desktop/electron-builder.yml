appId: com.finflow.app
productName: FinFlow
executableName: finflow
copyright: Copyright © 2026 FinFlow
electronVersion: "35.7.5"
npmRebuild: false
artifactName: "FinFlow-${version}-${os}-${arch}.${ext}"
directories:
  output: ../../release/desktop
files:
  - dist/**/*
  - package.json
extraResources:
  - from: ../web/dist
    to: web-dist
  - from: build-resources/api
    to: api
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: msi
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
msi:
  oneClick: false
linux:
  icon: build/icon.png
  category: Finance
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
deb:
  packageName: finflow
